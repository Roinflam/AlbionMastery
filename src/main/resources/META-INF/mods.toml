modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 四个武器来源全是可选依赖：装了哪个就接入哪个，没装的来源不会出现在专精树上，相关功能也不启用
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lrtactical"
    mandatory=false
    versionRange="[0.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="slashblade"
    mandatory=false
    versionRange="[1.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="[1.20.1-3.16,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[4.12,)"
    ordering="AFTER"
    side="BOTH"

# 本模组的 Mixin；可选模组没装时对应的 Mixin 由 AlbionMixinPlugin 跳过
[[mixins]]
config="${mod_id}.mixins.json"
