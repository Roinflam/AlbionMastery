modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Roinflam/AlbionMastery/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Roinflam/AlbionMastery"
credits="内嵌 shedaniel 的 Cloth Config API（GNU LGPLv3），未作修改，以独立 jar-in-jar 形式提供，只用于配置界面。专精玩法灵感来自《阿尔比恩 Online》的命运之板，段位规则与徽章造型参考《星际战甲》的精通段位；《Albion Online》是 Sandbox Interactive GmbH 的商标，《Warframe》是 Digital Extremes Ltd. 的商标，本模组为非官方同人作品，与它们无关联。 / Cloth Config API by shedaniel (GNU LGPLv3) is bundled unmodified as a separate jar-in-jar library, used only for the config screen. The mastery system is inspired by the Destiny Board of Albion Online, and the rank rules and emblem designs are based on Warframe's Mastery Rank. Albion Online is a trademark of Sandbox Interactive GmbH and Warframe is a trademark of Digital Extremes Ltd.; this is an unofficial fan-made mod and is not affiliated with or endorsed by them."
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 四个武器来源全是可选依赖：装了哪个就接入哪个，没装的来源不会出现在专精树上，相关功能也不启用
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lrtactical"
    mandatory=false
    versionRange="[0.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="slashblade"
    mandatory=false
    versionRange="[1.9,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    mandatory=false
    versionRange="[1.20.1-3.16,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ars_nouveau"
    mandatory=false
    versionRange="[4.12,)"
    ordering="AFTER"
    side="BOTH"

# FTB 任务也是可选依赖：装了就多一种「专精段位」任务（按段位 / 段位经验比较），没装不受影响
[[dependencies.${mod_id}]]
    modId="ftbquests"
    mandatory=false
    versionRange="[2001.4,)"
    ordering="AFTER"
    side="BOTH"

# 本模组的 Mixin；可选模组没装时对应的 Mixin 由 AlbionMixinPlugin 跳过
[[mixins]]
config="${mod_id}.mixins.json"
