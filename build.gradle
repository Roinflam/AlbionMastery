plugins {
    id 'java-library'
    // NeoForge 官方构建插件；1.20.5 起运行期就是 Mojang 映射，不再需要重映射和 refmap
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    // 产物：AlbionMastery-neoforge-1.21.1-<版本>.jar
    archivesName = "${archive_name}-neoforge-${minecraft_version}"
}

// Minecraft 1.21.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        // 客户端、服务端各用自己的游戏目录：测试客户端要往 mods 里放只给客户端用的开发 jar，
        // 和专用服共用一个 run/ 时专用服会因为加载到客户端类起不来
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            // 控制台中文不乱码
            jvmArguments.addAll('-Dfile.encoding=UTF-8', '-Dconsole.encoding=UTF-8',
                    '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8')
            // 第三方目标的注入器写了 expect：命中数不够时直接报错，别让加成悄悄失效
            jvmArguments.add('-Dmixin.debug.countInjections=true')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }  // Cloth Config
}

dependencies {
    // 各武器来源的模组 jar 只在本机编译用，不随源码分发（要哪些见 README）；
    // 运行期不挂：要测哪个来源，就把它和前置拷进 run/client/mods、run/server/mods
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    // Cloth Config：游戏内配置界面，以 jar-in-jar 内嵌，玩家不用另装
    jarJar(api("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")) {
        version {
            strictly "[${cloth_config_version},)"
            prefer cloth_config_version
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    // 模组名与简介含中文，固定过滤编码，系统默认编码是 GBK 时也不会乱码
    filteringCharset = 'UTF-8'

    var props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            cloth_config_version   : cloth_config_version
    ]
    inputs.properties props

    // 内嵌的 Cloth Config 是 LGPLv3，分发时附上 LGPLv3 和它所补充的 GPLv3 全文
    from('licenses') {
        into 'META-INF/licenses'
    }

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : mod_authors])
    }
}
