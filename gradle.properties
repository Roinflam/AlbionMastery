# Gradle 守护进程堆上限与源码编码
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false

# 模组信息
mod_id=albionmastery
mod_name=Albion Mastery
# 产物名前缀（大驼峰），mod_id 仍是全小写
archive_name=AlbionMastery
mod_license=CC BY-NC-SA 4.0
# 与 1.20.1 分支共用版本号
mod_version=1.1.2
mod_group_id=com.flameforge
mod_authors=Roinflam

# Minecraft 与 NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.265,)
# FML 加载器版本（1.21.1 是 4.x）
loader_version_range=[4,)

# Cloth Config（配置界面，jar-in-jar 内嵌）
cloth_config_version=15.0.140
